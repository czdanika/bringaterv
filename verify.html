<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- PWA: telepíthető app (iPhone / iPad: Megosztás → Főképernyőhöz adás) -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bringaterv">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="./src/assets/icons/apple-touch-icon.png">
  <title>Bringaterv – E-mail megerősítése</title>
  <link rel="stylesheet" href="./src/install.css">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="./src/version.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 10vh;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #111;
      overflow: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      background-image: url('./src/assets/btervlogin.png');
      background-size: cover;
      background-position: center 40%;
      filter: brightness(0.55) saturate(0.85);
      transform: scale(1.04);
    }

    /* Álló képernyőn (telefon, iPad állóban) a széles kép közepe látszana – helyette
       a kör alakú embléma a kártya fölött, ugyanazzal a sötétített hangulattal */
    @media (max-aspect-ratio: 4/5) {
      body { padding-top: calc(5vh + min(52vw, 280px) + 20px + env(safe-area-inset-top)); }
      .bg {
        background-color: #f5f2e9;
        background-image: url('./src/assets/icons/icon-512.png');
        background-repeat: no-repeat;
        background-size: min(52vw, 280px);
        background-position: center calc(5vh + env(safe-area-inset-top));
        transform: none;
      }
    }

    .card {
      position: relative;
      z-index: 10;
      width: 420px;
      max-width: calc(100vw - 32px);
      padding: 24px 36px 20px;
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      color: #1a1a1a;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.40);
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .logo-img {
      width: 40px;
      height: 40px;
      border-radius: 9px;
    }

    .logo-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      line-height: 1;
      color: #1a1a1a;
    }

    .logo-text .accent { color: #fc4c02; }

    .subtitle {
      font-size: 12.5px;
      color: rgba(0, 0, 0, 0.40);
      margin-bottom: 18px;
      letter-spacing: 0.2px;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 10px;
    }

    .input-wrap svg {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(0,0,0,0.30);
      pointer-events: none;
    }

    input[type="text"],
    input[type="password"], input[type="email"] {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: rgba(0, 0, 0, 0.06);
      border: 1.5px solid rgba(0, 0, 0, 0.12);
      border-radius: 10px;
      color: #1a1a1a;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    input::placeholder { color: rgba(0, 0, 0, 0.30); }

    input:focus {
      border-color: #fc4c02;
      background: rgba(252, 76, 2, 0.04);
    }

    .error-msg {
      font-size: 12.5px;
      color: #d63030;
      margin-bottom: 10px;
      min-height: 18px;
      text-align: left;
      padding-left: 2px;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: #fc4c02;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.18s, transform 0.1s;
      letter-spacing: 0.2px;
      margin-top: 4px;
    }

    .login-btn:hover { background: #e04400; }
    .login-btn:active { transform: scale(0.98); }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      text-align: left;
      font-size: 12px;
      color: rgba(0, 0, 0, 0.55);
      margin: 4px 2px 12px;
      line-height: 1.45;
    }
    .consent input[type="checkbox"] {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      margin-top: 1px;
      accent-color: #fc4c02;
      cursor: pointer;
    }
    .consent label { cursor: pointer; }
    .consent a { color: #fc4c02; font-weight: 600; text-decoration: none; }
    .consent a:hover { text-decoration: underline; }

    .login-btn:disabled {
      background: rgba(0, 0, 0, 0.18);
      cursor: not-allowed;
    }
    .login-btn:disabled:hover { background: rgba(0, 0, 0, 0.18); }

    .card-footer {
      margin-top: 14px;
      font-size: 11px;
      color: rgba(0, 0, 0, 0.25);
    }

    /* Regisztráció: hosszabb űrlap → görgethető oldal */
    body { overflow: auto; padding-bottom: 40px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row2 .input-wrap { margin-bottom: 0; }
    .row2 { margin-bottom: 12px; }
    .row2 input { padding-left: 14px !important; }   /* itt nincs ikon */
    .invite-info { font-size: 13px; color: rgba(0,0,0,.6); margin: -6px 0 16px; line-height: 1.5; }
    .invite-info b { color: #111; }
    .field-hint { font-size: 11px; color: rgba(0,0,0,.45); margin: -6px 0 12px 4px; text-align: left; }
    .invalid-box { padding: 18px 4px 6px; font-size: 14px; color: rgba(0,0,0,.7); line-height: 1.6; }
    .invalid-box a { color: #fc4c02; font-weight: 600; }
    .ok-box { padding: 14px 4px 6px; font-size: 14px; color: rgba(0,0,0,.7); line-height: 1.6; }
    .ok-icon { width: 52px; height: 52px; margin: 6px auto 10px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(22,163,74,.12); color: #16a34a; font-size: 26px; font-weight: 800; }
    .ok-box .login-btn { margin-top: 16px; display: block; text-decoration: none; text-align: center; line-height: 46px; }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="card">
    <div class="logo-wrap">
      <img src="./src/assets/logo.png" alt="Bringaterv logó" class="logo-img">
      <span class="logo-text">Bringa<span class="accent">terv</span></span>
    </div>
    <p class="subtitle">E-mail-cím megerősítése</p>
    <div id="msg" class="ok-box">Megerősítés folyamatban…</div>
  </div>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const token = new URLSearchParams(location.search).get("t") || "";
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const fail = (m) => { $("msg").innerHTML = `${esc(m)}<a class="login-btn" href="./index.html">Tovább az appba</a>`; };
    (async () => {
      if (!token) return fail("Hiányzik a megerősítő kód a linkből.");
      try {
        const r = await fetch("/api/account/verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) return fail(d.error || "A megerősítés nem sikerült.");
        history.replaceState(null, "", "./verify");
        $("msg").innerHTML = `<div class="ok-icon">✓</div><b>Köszönöm, megerősítve!</b><br>${esc(d.email)}<a class="login-btn" href="./index.html">Tovább az appba</a>`;
      } catch {
        fail("A szerver most nem érhető el – próbáld újra később.");
      }
    })();
  </script>
</body>
</html>
