# ── Bringaterv – Docker Compose ──────────────────────────────────────────────
#
# Két szolgáltatás:
#   bringaterv   – nginx, statikus frontend (port: ${PORT:-8088})
#   routes-api   – Flask REST API, csak belső hálózaton érhető el
#
# Volume:
#   routes-data  – felhasználói GPX fájlok és index.json tartós tárolása
#                  (Docker volume, NAS-on /var/lib/docker/volumes/... alatt)
#
# Hálózat:
#   bringaterv-net – belső bridge hálózat; routes-api kívülről NEM elérhető

services:

  # ── Frontend (nginx) ────────────────────────────────────────────────────────
  bringaterv:
    # Éles: image: ghcr.io/czdanika/bringaterv:latest
    build:
      context: .
    ports:
      - "${PORT:-8088}:80"
    environment:
      LOGIN_ENABLED: ${LOGIN_ENABLED:-true}
      # Publikus megosztási (QR) alap-URL; üresen a böngésző címe
      SHARE_BASE_URL: ${SHARE_BASE_URL:-}
    depends_on:
      - routes-api
    networks:
      - bringaterv-net
    restart: unless-stopped

  # ── Útvonaltár API (Flask) ──────────────────────────────────────────────────
  routes-api:
    # Éles: GHCR-ről húzza (GitHub Actions buildeli)
    # image: ghcr.io/czdanika/bringaterv-api:latest
    # Helyi fejlesztés / első telepítés előtt:
    build:
      context: ./routes-api
    environment:
      DATA_DIR:    /data/routes   # (migráció miatt megőrizve)
      SAMPLES_DIR: /samples       # beépített minták (image-be égetve)

      # ── Adatbázis és per-user tárolás ────────────────────────────────────
      DB_PATH:        /data/bringaterv.db     # SQLite adatbázis
      MULTI_DATA_DIR: /data/users             # per-user mappák
      PUBLIC_SHARE_ENABLED: ${PUBLIC_SHARE_ENABLED:-true}   # false → publikus nézőoldal ki
      ADMIN_EMAIL:    ${ADMIN_EMAIL:-${LOGIN_USER:-admin}}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-${LOGIN_PASSWORD:-ide-ird-a-jelszot}}
      JWT_SECRET:     ${JWT_SECRET:-change-me-please}
      JWT_EXPIRY_DAYS: ${JWT_EXPIRY_DAYS:-30}

      # ── E-mail (visszajelzések továbbítása) – üresen: csak az admin felületen ─
      SMTP_HOST:     ${SMTP_HOST:-}          # pl. smtp.gmail.com
      SMTP_PORT:     ${SMTP_PORT:-587}       # 587 = STARTTLS, 465 = SSL
      SMTP_USER:     ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}      # Gmail: alkalmazásjelszó
      SMTP_FROM:     ${SMTP_FROM:-}          # alapból SMTP_USER
      FEEDBACK_TO:   ${FEEDBACK_TO:-}        # címzett(ek), vesszővel; alapból a feladó
      PUBLIC_URL:    ${PUBLIC_URL:-}         # a levelek linkjeinek alapcíme, pl. https://bringaterv.example.hu
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}   # e-mail küldés mellett kötelező a cím megerősítése
    volumes:
      - routes-data:/data    # tartós tároló (routes + db + users)
    networks:
      - bringaterv-net
    # Szándékosan NINCS ports: blokk → kívülről nem érhető el, csak nginx-en át
    restart: unless-stopped

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  routes-data:
    # Named volume – Docker kezeli a helyét (NAS-on is perzisztens)
    # Ha konkrét NAS elérési utat akarsz, használd:
    # driver: local
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /volume1/docker/bringaterv-routes

# ── Hálózat ──────────────────────────────────────────────────────────────────
networks:
  bringaterv-net:
    driver: bridge
