# Saját BRouter (útvonaltervező): IP-címenkénti terheléskorlát a NAS védelmére
limit_req_zone $binary_remote_addr zone=brouter:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── MIME típusok ────────────────────────────────────────────────────────
    types {
        text/html                   html htm;
        application/javascript      js mjs;
        text/css                    css;
        image/png                   png;
        image/jpeg                  jpg jpeg;
        image/svg+xml               svg;
        image/x-icon                ico;
        application/json            json;
        application/manifest+json   webmanifest;
        application/gpx+xml         gpx;
        font/woff2                  woff2;
        font/woff                   woff;
    }

    # ── Tömörítés ───────────────────────────────────────────────────────────
    # A GPX / JSON / JS szöveg gzippel ~10–20× kisebb (egy 2,5 MB-os edzés-GPX ~130 KB).
    # gzip_proxied any: az /api/ válaszai (routes-api) is tömörülnek.
    gzip              on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        text/css text/plain text/xml application/javascript application/json
                      application/manifest+json application/gpx+xml application/xml image/svg+xml;

    # ── Útvonaltár API proxy ─────────────────────────────────────────────────
    # Minden /api/ kezdetű kérés a Flask routes-api konténerbe kerül.
    # A konténer neve a Docker Compose service neve (routes-api),
    # amit a belső bringaterv-net hálózaton old fel a DNS.
    # Backup visszaállítás: a teljes profil ZIP-je nagyobb lehet a 10 MB-os általános limitnél
    location ~ ^/api/(user|admin/users/[A-Za-z0-9_-]+)/restore$ {
        proxy_pass         http://routes-api:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
        proxy_read_timeout 300s;
    }

    # ── Saját BRouter útvonaltervező (stack: brouter szolgáltatás) ──────────
    # Változón át (resolver) hívjuk, így az nginx akkor is elindul, ha nincs brouter
    # konténer – ilyenkor 502-t ad, és a kliens a brouter.de-re vált. Csak GET.
    location = /brouter {
        limit_except GET { deny all; }
        limit_req zone=brouter burst=60 nodelay;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $brouter_upstream http://brouter:17777;
        proxy_pass $brouter_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass         http://routes-api:5001;
        proxy_http_version 1.1;

        # Fejlécek továbbítása (Flask logokban látszódjon az eredeti IP)
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Nagy GPX fájlok feltöltéséhez (max 10 MB)
        client_max_body_size 10m;

        # Timeout – gunicorn 120s timeout-jával összhangban
        proxy_read_timeout 130s;
        proxy_connect_timeout 10s;
    }

    # ── Statikus fájlok (képek, fontok) – hosszú cache ───────────────────────
    location ~* ^(?!/api/).*\.(png|jpg|jpeg|svg|ico|woff2|woff)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── JS és CSS – mindig ellenőrzés (frissítés után azonnal betölti az újat) ──
    location ~* ^(?!/api/).*\.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Rövid címek: /admin → admin felület, /invite → meghívásos regisztráció ──
    location = /admin  { try_files /admin.html =404;  add_header Cache-Control "no-cache"; }
    location = /admin/ { return 301 /admin; }
    location = /invite { try_files /invite.html =404; add_header Cache-Control "no-cache"; }
    location = /register { try_files /invite.html =404; add_header Cache-Control "no-cache"; }
    location = /bemutato { try_files /bemutato.html =404; add_header Cache-Control "no-cache"; }
    location = /reset  { try_files /reset.html =404;  add_header Cache-Control "no-cache"; }
    location = /verify { try_files /verify.html =404; add_header Cache-Control "no-cache"; }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # A HTML-t mindig újra kell ellenőrizni (ETag → 304), különben deploy után
    # a böngésző a régi oldalt az új JS-sel keverheti.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
