<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- PWA: telepíthető app (iPhone / iPad: Megosztás → Főképernyőhöz adás) -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bringaterv">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="./src/assets/icons/apple-touch-icon.png">
  <title>Bringaterv – Új jelszó</title>
  <link rel="stylesheet" href="./src/install.css">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="./src/version.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 10vh;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #111;
      overflow: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      background-image: url('./src/assets/btervlogin.png');
      background-size: cover;
      background-position: center 40%;
      filter: brightness(0.55) saturate(0.85);
      transform: scale(1.04);
    }

    /* Álló képernyőn (telefon, iPad állóban) a széles kép közepe látszana – helyette
       a kör alakú embléma a kártya fölött, ugyanazzal a sötétített hangulattal */
    @media (max-aspect-ratio: 4/5) {
      body { padding-top: calc(5vh + min(52vw, 280px) + 20px + env(safe-area-inset-top)); }
      .bg {
        background-color: #f5f2e9;
        background-image: url('./src/assets/icons/icon-512.png');
        background-repeat: no-repeat;
        background-size: min(52vw, 280px);
        background-position: center calc(5vh + env(safe-area-inset-top));
        transform: none;
      }
    }

    .card {
      position: relative;
      z-index: 10;
      width: 420px;
      max-width: calc(100vw - 32px);
      padding: 24px 36px 20px;
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      color: #1a1a1a;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.40);
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .logo-img {
      width: 40px;
      height: 40px;
      border-radius: 9px;
    }

    .logo-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      line-height: 1;
      color: #1a1a1a;
    }

    .logo-text .accent { color: #fc4c02; }

    .subtitle {
      font-size: 12.5px;
      color: rgba(0, 0, 0, 0.40);
      margin-bottom: 18px;
      letter-spacing: 0.2px;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 10px;
    }

    .input-wrap svg {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(0,0,0,0.30);
      pointer-events: none;
    }

    input[type="text"],
    input[type="password"], input[type="email"] {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: rgba(0, 0, 0, 0.06);
      border: 1.5px solid rgba(0, 0, 0, 0.12);
      border-radius: 10px;
      color: #1a1a1a;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    input::placeholder { color: rgba(0, 0, 0, 0.30); }

    input:focus {
      border-color: #fc4c02;
      background: rgba(252, 76, 2, 0.04);
    }

    .error-msg {
      font-size: 12.5px;
      color: #d63030;
      margin-bottom: 10px;
      min-height: 18px;
      text-align: left;
      padding-left: 2px;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: #fc4c02;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.18s, transform 0.1s;
      letter-spacing: 0.2px;
      margin-top: 4px;
    }

    .login-btn:hover { background: #e04400; }
    .login-btn:active { transform: scale(0.98); }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      text-align: left;
      font-size: 12px;
      color: rgba(0, 0, 0, 0.55);
      margin: 4px 2px 12px;
      line-height: 1.45;
    }
    .consent input[type="checkbox"] {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      margin-top: 1px;
      accent-color: #fc4c02;
      cursor: pointer;
    }
    .consent label { cursor: pointer; }
    .consent a { color: #fc4c02; font-weight: 600; text-decoration: none; }
    .consent a:hover { text-decoration: underline; }

    .login-btn:disabled {
      background: rgba(0, 0, 0, 0.18);
      cursor: not-allowed;
    }
    .login-btn:disabled:hover { background: rgba(0, 0, 0, 0.18); }

    .card-footer {
      margin-top: 14px;
      font-size: 11px;
      color: rgba(0, 0, 0, 0.25);
    }

    /* Regisztráció: hosszabb űrlap → görgethető oldal */
    body { overflow: auto; padding-bottom: 40px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row2 .input-wrap { margin-bottom: 0; }
    .row2 { margin-bottom: 12px; }
    .row2 input { padding-left: 14px !important; }   /* itt nincs ikon */
    .invite-info { font-size: 13px; color: rgba(0,0,0,.6); margin: -6px 0 16px; line-height: 1.5; }
    .invite-info b { color: #111; }
    .field-hint { font-size: 11px; color: rgba(0,0,0,.45); margin: -6px 0 12px 4px; text-align: left; }
    .invalid-box { padding: 18px 4px 6px; font-size: 14px; color: rgba(0,0,0,.7); line-height: 1.6; }
    .invalid-box a { color: #fc4c02; font-weight: 600; }
    .ok-box { padding: 14px 4px 6px; font-size: 14px; color: rgba(0,0,0,.7); line-height: 1.6; }
    .ok-icon { width: 52px; height: 52px; margin: 6px auto 10px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(22,163,74,.12); color: #16a34a; font-size: 26px; font-weight: 800; }
    .ok-box .login-btn { margin-top: 16px; display: block; text-decoration: none; text-align: center; line-height: 46px; }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="card">
    <div class="logo-wrap">
      <img src="./src/assets/logo.png" alt="Bringaterv logó" class="logo-img">
      <span class="logo-text">Bringa<span class="accent">terv</span></span>
    </div>
    <p class="subtitle" id="subtitle">Elfelejtett jelszó</p>

    <!-- 1. Link kérése -->
    <form id="askForm" novalidate hidden>
      <p class="invite-info">Add meg a belépési neved vagy az e-mail-címed. Ha van hozzá megerősített e-mail-cím, küldünk rá egy linket, amivel új jelszót állíthatsz be.</p>
      <div class="input-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input id="login" type="text" placeholder="Belépési név vagy e-mail" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <p class="error-msg" id="askError"></p>
      <button type="submit" class="login-btn">Link küldése</button>
    </form>

    <!-- 2. Új jelszó a linkből -->
    <form id="resetForm" novalidate hidden>
      <p class="invite-info" id="resetInfo">Adj meg egy új jelszót.</p>
      <input type="text" id="resetLogin" autocomplete="username" hidden>
      <div class="input-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="password" type="password" placeholder="Új jelszó (min. 8 karakter)" autocomplete="new-password">
      </div>
      <div class="input-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="password2" type="password" placeholder="Új jelszó újra" autocomplete="new-password">
      </div>
      <p class="error-msg" id="resetError"></p>
      <button type="submit" class="login-btn">Jelszó mentése</button>
    </form>

    <div id="msg" class="ok-box" hidden></div>
    <p class="card-footer"><a href="./login.html" style="color:inherit">Vissza a bejelentkezéshez</a></p>
  </div>

  <script type="module">
    const JWT_KEY = "bringaterv_jwt", USER_KEY = "bringaterv_user";
    const $ = (id) => document.getElementById(id);
    const token = new URLSearchParams(location.search).get("t") || "";
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function show(html, ok = true) {
      $("askForm").hidden = $("resetForm").hidden = true;
      $("msg").hidden = false;
      $("msg").innerHTML = (ok ? `<div class="ok-icon">✓</div>` : "") + html;
    }

    if (!token) {
      $("askForm").hidden = false;
      $("login").focus();
    } else {
      $("subtitle").textContent = "Új jelszó beállítása";
      fetch(`/api/auth/reset/${encodeURIComponent(token)}`).then((r) => r.json().then((d) => [r.ok, d]))
        .then(([ok, d]) => {
          if (!ok || !d.valid) return show(`A link érvénytelen, lejárt, vagy már felhasználták.<br><a href="./reset">Kérj újat</a>.`, false);
          $("resetForm").hidden = false;
          $("resetLogin").value = d.login || "";
          $("resetInfo").innerHTML = `Új jelszó ehhez a fiókhoz: <b>${esc(d.login)}</b>`;
          $("password").focus();
        })
        .catch(() => show("A szerver most nem érhető el – próbáld újra később.", false));
    }

    $("askForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button"), err = $("askError");
      err.textContent = "";
      const login = $("login").value.trim();
      if (!login) { err.textContent = "Add meg a belépési neved vagy e-mail-címed."; return; }
      btn.disabled = true; btn.textContent = "Küldés…";
      try {
        const r = await fetch("/api/auth/forgot", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ login }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || "Nem sikerült – próbáld újra.");
        show(`<b>Nézd meg a postafiókodat.</b><br>${esc(d.message)}<br><br>A link 60 percig érvényes. Ha nem jön meg pár percen belül, nézd meg a spam mappát is.<br><br>Nincs megerősített e-mail-címed? Kérd meg az admint, hogy állítson be új jelszót.`);
      } catch (ex) {
        err.textContent = ex.message;
        btn.disabled = false; btn.textContent = "Link küldése";
      }
    });

    $("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button"), err = $("resetError");
      err.textContent = "";
      const pw = $("password").value;
      if (pw.length < 8) { err.textContent = "A jelszó legalább 8 karakter legyen."; return; }
      if (pw !== $("password2").value) { err.textContent = "A két jelszó nem egyezik."; return; }
      btn.disabled = true; btn.textContent = "Mentés…";
      try {
        const r = await fetch("/api/auth/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token, password: pw }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || "Nem sikerült – próbáld újra.");
        localStorage.setItem(JWT_KEY, d.token);
        localStorage.setItem(USER_KEY, JSON.stringify(d.user));
        history.replaceState(null, "", "./reset");
        show(`<b>Kész, az új jelszavad beállítva.</b><br>Minden más eszközön ki kell lépned és újra be.<a class="login-btn" href="./index.html">Tovább az appba</a>`);
      } catch (ex) {
        err.textContent = ex.message;
        btn.disabled = false; btn.textContent = "Jelszó mentése";
      }
    });
  </script>
</body>
</html>
