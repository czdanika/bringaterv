<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- PWA: telepíthető app (iPhone / iPad: Megosztás → Főképernyőhöz adás) -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bringaterv">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="./src/assets/icons/apple-touch-icon.png">
  <title>Bringaterv – Regisztráció</title>
  <link rel="stylesheet" href="./src/install.css">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="./src/version.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 10vh;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #111;
      overflow: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      background-image: url('./src/assets/btervlogin.png');
      background-size: cover;
      background-position: center 40%;
      filter: brightness(0.55) saturate(0.85);
      transform: scale(1.04);
    }

    /* Álló képernyőn (telefon, iPad állóban) a széles kép közepe látszana – helyette
       a kör alakú embléma a kártya fölött, ugyanazzal a sötétített hangulattal */
    @media (max-aspect-ratio: 4/5) {
      body { padding-top: calc(5vh + min(52vw, 280px) + 20px + env(safe-area-inset-top)); }
      .bg {
        background-color: #f5f2e9;
        background-image: url('./src/assets/icons/icon-512.png');
        background-repeat: no-repeat;
        background-size: min(52vw, 280px);
        background-position: center calc(5vh + env(safe-area-inset-top));
        transform: none;
      }
    }

    .card {
      position: relative;
      z-index: 10;
      width: 420px;
      max-width: calc(100vw - 32px);
      padding: 24px 36px 20px;
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      color: #1a1a1a;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.40);
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .logo-img {
      width: 40px;
      height: 40px;
      border-radius: 9px;
    }

    .logo-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      line-height: 1;
      color: #1a1a1a;
    }

    .logo-text .accent { color: #fc4c02; }

    .subtitle {
      font-size: 12.5px;
      color: rgba(0, 0, 0, 0.40);
      margin-bottom: 18px;
      letter-spacing: 0.2px;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 10px;
    }

    .input-wrap svg {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(0,0,0,0.30);
      pointer-events: none;
    }

    input[type="text"],
    input[type="password"], input[type="email"] {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: rgba(0, 0, 0, 0.06);
      border: 1.5px solid rgba(0, 0, 0, 0.12);
      border-radius: 10px;
      color: #1a1a1a;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    input::placeholder { color: rgba(0, 0, 0, 0.30); }

    input:focus {
      border-color: #fc4c02;
      background: rgba(252, 76, 2, 0.04);
    }

    .error-msg {
      font-size: 12.5px;
      color: #d63030;
      margin-bottom: 10px;
      min-height: 18px;
      text-align: left;
      padding-left: 2px;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: #fc4c02;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.18s, transform 0.1s;
      letter-spacing: 0.2px;
      margin-top: 4px;
    }

    .login-btn:hover { background: #e04400; }
    .login-btn:active { transform: scale(0.98); }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      text-align: left;
      font-size: 12px;
      color: rgba(0, 0, 0, 0.55);
      margin: 4px 2px 12px;
      line-height: 1.45;
    }
    .consent input[type="checkbox"] {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      margin-top: 1px;
      accent-color: #fc4c02;
      cursor: pointer;
    }
    .consent label { cursor: pointer; }
    .consent a { color: #fc4c02; font-weight: 600; text-decoration: none; }
    .consent a:hover { text-decoration: underline; }

    .login-btn:disabled {
      background: rgba(0, 0, 0, 0.18);
      cursor: not-allowed;
    }
    .login-btn:disabled:hover { background: rgba(0, 0, 0, 0.18); }

    .card-footer {
      margin-top: 14px;
      font-size: 11px;
      color: rgba(0, 0, 0, 0.25);
    }

    /* Regisztráció: hosszabb űrlap → görgethető oldal */
    body { overflow: auto; padding-bottom: 40px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row2 .input-wrap { margin-bottom: 0; }
    .row2 { margin-bottom: 12px; }
    .row2 input { padding-left: 14px !important; }   /* itt nincs ikon */
    .invite-info { font-size: 13px; color: rgba(0,0,0,.6); margin: -6px 0 16px; line-height: 1.5; }
    .invite-info b { color: #111; }
    .field-hint { font-size: 11px; color: rgba(0,0,0,.45); margin: -6px 0 12px 4px; text-align: left; }
    .invalid-box { padding: 18px 4px 6px; font-size: 14px; color: rgba(0,0,0,.7); line-height: 1.6; }
    .invalid-box a { color: #fc4c02; font-weight: 600; }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="card">
    <div class="logo-wrap">
      <img src="./src/assets/logo.png" alt="Bringaterv logó" class="logo-img">
      <span class="logo-text">Bringa<span class="accent">terv</span></span>
    </div>
    <p class="subtitle">Regisztráció meghívóval</p>

    <div id="checking" class="invalid-box">Meghívó ellenőrzése…</div>
    <div id="invalid" class="invalid-box" hidden></div>

    <form id="regForm" novalidate hidden>
      <p class="invite-info" id="inviteInfo"></p>
      <div class="row2">
        <div class="input-wrap"><input id="lastName" type="text" placeholder="Vezetéknév" autocomplete="family-name"></div>
        <div class="input-wrap"><input id="firstName" type="text" placeholder="Keresztnév" autocomplete="given-name"></div>
      </div>
      <div class="input-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
        <input id="email" type="email" placeholder="E-mail-cím" autocomplete="email" autocapitalize="none" spellcheck="false">
      </div>
      <p class="field-hint">Ezzel fogsz belépni, és ide küldünk egy megerősítő levelet.</p>
      <div class="input-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="password" type="password" placeholder="Jelszó (min. 8 karakter)" autocomplete="new-password">
      </div>
      <div class="input-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="password2" type="password" placeholder="Jelszó újra" autocomplete="new-password">
      </div>
      <div class="consent">
        <input type="checkbox" id="privacyConsent">
        <label for="privacyConsent">Elolvastam és tudomásul vettem az <a href="./privacy.html" target="_blank" rel="noopener">adatkezelési tájékoztatót</a>.</label>
      </div>
      <p class="error-msg" id="errorMsg"></p>
      <button type="submit" class="login-btn" disabled>Regisztráció</button>
    </form>
    <p class="card-footer">Van már fiókod? <a href="./login.html" style="color:inherit">Bejelentkezés</a></p>
  </div>

  <script type="module">
    const JWT_KEY = "bringaterv_jwt", USER_KEY = "bringaterv_user";
    const token = new URLSearchParams(location.search).get("t") || "";
    const $ = (id) => document.getElementById(id);
    const form = $("regForm"), btn = form.querySelector(".login-btn"), errEl = $("errorMsg");

    function invalid(msg) {
      $("checking").hidden = true;
      $("invalid").hidden = false;
      $("invalid").innerHTML = `${msg}<br><br>Kérj új meghívót attól, aki küldte, vagy <a href="./login.html">jelentkezz be</a>, ha már van fiókod.`;
    }

    (async () => {
      if (!token) return invalid("Hiányzik a meghívó kódja a linkből.");
      try {
        const r = await fetch(`/api/invite/${encodeURIComponent(token)}`);
        const d = await r.json().catch(() => ({}));
        if (!r.ok || !d.valid) return invalid(d.error || "Ez a meghívó nem érvényes.");
        $("checking").hidden = true;
        form.hidden = false;
        const exp = d.expires_at ? new Date(d.expires_at).toLocaleDateString("hu-HU", { month: "long", day: "numeric" }) : "";
        $("inviteInfo").textContent = "Meghívást kaptál a Bringatervbe – útvonaltervezés és edzésnapló egy helyen."
          + (exp ? ` A meghívó ${exp}-ig érvényes.` : "");
        $("lastName").focus();
      } catch {
        invalid("A szerver most nem érhető el – próbáld újra később.");
      }
    })();

    $("privacyConsent").addEventListener("change", (e) => { btn.disabled = !e.target.checked; });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errEl.textContent = "";
      const pw = $("password").value, pw2 = $("password2").value;
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test($("email").value.trim())) { errEl.textContent = "Adj meg egy érvényes e-mail-címet."; return; }
      if (pw.length < 8) { errEl.textContent = "A jelszó legalább 8 karakter legyen."; return; }
      if (pw !== pw2) { errEl.textContent = "A két jelszó nem egyezik."; return; }
      btn.disabled = true; btn.textContent = "Regisztráció…";
      try {
        const r = await fetch(`/api/invite/${encodeURIComponent(token)}/register`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            first_name: $("firstName").value, last_name: $("lastName").value,
            email: $("email").value, password: pw, consent: $("privacyConsent").checked,
          }),
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || "A regisztráció nem sikerült.");
        localStorage.setItem(JWT_KEY, d.token);
        localStorage.setItem(USER_KEY, JSON.stringify(d.user));
        try { localStorage.setItem("bringaterv.privacyAccepted", "2026-06"); } catch {}
        location.replace("./index.html");
      } catch (err) {
        errEl.textContent = err.message;
        btn.disabled = false; btn.textContent = "Regisztráció";
      }
    });
  </script>
</body>
</html>
