<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bringaterv – Útvonal</title>
  <script>
    // Téma: ugyanaz a kulcs, mint a fő appban (villanásmentes beállítás)
    (function () {
      try {
        var t = localStorage.getItem("route4meTheme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (_) {}
    })();
  </script>
  <link rel="icon" type="image/png" href="./src/assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="./src/styles.css">
  <style>
    /* ── Nézőoldal elrendezés (a fő app stílusaira építve) ─────────────── */
    html, body { height: 100%; }
    body { overflow: hidden; }
    .vw-shell { display: grid; grid-template-rows: auto 1fr; height: 100vh; height: 100dvh; }
    .vw-body { display: grid; grid-template-columns: 380px 1fr; min-height: 0; }
    .vw-side { background: var(--sidebar-bg); box-shadow: var(--sidebar-shadow); overflow-y: auto;
      padding: 14px 14px 24px; display: flex; flex-direction: column; gap: 12px; z-index: 2; }
    .vw-main { display: flex; flex-direction: column; gap: 14px; padding: 14px; min-height: 0; min-width: 0; }
    .vw-map-card, .vw-charts { background: var(--panel-bg); border: 1px solid var(--line); border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06); }
    .vw-map-card { position: relative; flex: 1 1 auto; min-height: 280px; overflow: hidden; }
    #v-map { position: absolute; inset: 0; background: var(--panel-strong); }
    .vw-charts { flex: 0 0 auto; max-height: 48%; overflow-y: auto; padding: 4px 18px 10px; }

    /* Lebegő térkép-eszközök (jobb felső sarok) */
    .vw-map-tools { position: absolute; top: 12px; right: 12px; z-index: 1000; display: flex; gap: 8px; align-items: flex-start; }
    .vw-tool-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; min-width: 36px;
      padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-bg); color: var(--text);
      font: 600 12.5px/1 inherit; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.14); }
    .vw-tool-btn:hover { background: var(--panel-strong); }
    .vw-tool-btn svg { width: 16px; height: 16px; color: var(--muted); }
    .vw-map-tools .sidebar-style-popup { top: calc(100% + 8px); right: 0; }
    .leaflet-control-zoom { border: 1px solid var(--line) !important; border-radius: 10px !important; overflow: hidden;
      box-shadow: 0 2px 10px rgba(0,0,0,.14) !important; margin: 12px 0 0 12px !important; }
    .leaflet-control-zoom a { background: var(--panel-bg) !important; color: var(--text) !important; border-color: var(--line) !important; }

    .vw-file-head { display: flex; align-items: center; gap: 12px; padding: 2px 2px 14px; border-bottom: 1px solid var(--line); }
    .vw-title-block { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
    .vw-file-date { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vw-file-date:empty { display: none; }
    .vw-sport-icon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px;
      background: var(--brand-soft); color: var(--brand); flex-shrink: 0; }
    .vw-sport-icon svg { width: 22px; height: 22px; }
    .vw-file-name { font-weight: 800; font-size: 17px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vw-style-wrap { position: relative; }
    .vw-section-title { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      color: var(--muted); margin: 4px 2px 0; }
    .vw-desc { font-size: 13px; line-height: 1.5; white-space: pre-wrap; color: var(--text); padding: 0 2px; }
    .vw-open { display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
      background: var(--accent-strong); color: var(--bg); font-weight: 700; font-size: 13px; padding: 10px 14px; border-radius: 10px; }
    .vw-open svg { width: 15px; height: 15px; }
    .vw-note { font-size: 11.5px; color: var(--muted); text-align: center; }

    .v-chart-toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .v-toggle-row { display: flex; align-items: center; gap: 8px; padding: 9px 10px; background: var(--panel-bg);
      border: 1px solid var(--line); border-radius: 7px; cursor: pointer; user-select: none; min-width: 0; }
    .v-toggle-swatch { width: 14px; height: 3px; border-radius: 2px; background: var(--c); flex-shrink: 0; }
    .v-toggle-label { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .v-chart { padding: 4px 0; border-top: 1px solid var(--line); }
    .v-chart:first-child { border-top: 0; }
    .v-chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .v-chart-head h2 { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      color: var(--muted); margin: 8px 0 2px; }
    .v-readout { font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; }
    .v-chart canvas { width: 100%; height: 110px; display: block; touch-action: pan-y; cursor: crosshair; }

    .vw-state { position: fixed; inset: 64px 0 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 10px; color: var(--muted); background: var(--bg); z-index: 1000; text-align: center; padding: 20px; }
    .v-spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--brand);
      border-radius: 50%; animation: vwsp .8s linear infinite; }
    @keyframes vwsp { to { transform: rotate(360deg); } }

    /* Mobil: egymás alatt – térkép, adatlap, grafikonok */
    @media (max-width: 820px) {
      body { overflow: auto; }
      .vw-shell { height: auto; display: block; }
      .vw-body { display: flex; flex-direction: column; }
      /* térkép → adatlap → grafikonok */
      .vw-main { display: contents; }
      .vw-map-card { order: 1; flex: none; height: 52vh; margin: 10px 10px 0; }
      .vw-charts { order: 3; margin: 0 10px 12px; }
      .vw-side { order: 2; box-shadow: none; overflow: visible; background: transparent; }
      .vw-charts { max-height: none; overflow: visible; }
      .topnav-slogan { display: none; }
    }
  </style>
</head>
<body>
  <div class="vw-shell">
    <header class="topnav">
      <div class="topnav-brand">
        <a href="/" id="v-homelink" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit">
          <img src="./src/assets/logo.png" alt="Bringaterv logó" class="topnav-logo">
          <div class="topnav-brand-text">
            <span class="topnav-name">Bringa<span class="brand-accent">terv</span></span>
            <span class="topnav-slogan">Tervezz, tekerj, fedezd fel!</span>
          </div>
        </a>
      </div>
      <div class="topnav-end">
        <button id="themeToggle" class="topnav-icon-btn" type="button" title="Sötét/világos mód">
          <i data-lucide="sun" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <div class="vw-body" id="v-content" hidden>
      <aside class="vw-side">
        <div class="vw-file-head">
          <span class="vw-sport-icon" id="v-sport-icon"><i data-lucide="bike" aria-hidden="true"></i></span>
          <div class="vw-title-block">
            <span class="vw-file-name" id="v-name">Útvonal</span>
            <span class="vw-file-date" id="v-date"></span>
          </div>
        </div>

        <div class="stats-panel file-stats" id="v-stats"></div>

        <div id="v-desc-wrap" hidden>
          <div class="vw-section-title">Leírás</div>
          <div class="vw-desc" id="v-desc"></div>
        </div>

        <div id="v-toggle-wrap" hidden>
          <div class="vw-section-title" style="margin-bottom:8px">Grafikonok</div>
          <div class="v-chart-toggles" id="v-chart-toggles"></div>
        </div>

        <a class="vw-open" id="v-open" href="/"><i data-lucide="log-in" aria-hidden="true"></i>Megnyitás a Bringatervben</a>
        <div class="vw-note">Csak megtekintés – szerkesztéshez jelentkezz be.</div>
      </aside>

      <main class="vw-main">
        <div class="vw-map-card">
          <div id="v-map"></div>
          <div class="vw-map-tools">
            <button id="vFitBtn" class="vw-tool-btn" type="button" title="Teljes útvonal">
              <i data-lucide="maximize" aria-hidden="true"></i>
            </button>
            <div class="vw-style-wrap">
              <button id="vStyleBtn" class="vw-tool-btn vw-tool-btn--label" type="button" title="Térképstílus">
                <i data-lucide="layers" aria-hidden="true"></i>
                <span id="vStyleLabel">Standard</span>
              </button>
            <div id="vStylePicker" class="sidebar-style-popup" hidden>
              <div class="settings-map-styles sidebar-map-styles">
                <button class="settings-style-btn" data-map-style="standard" type="button"><span class="settings-style-preview settings-style-preview--standard"></span><span class="settings-style-label">Standard</span></button>
                <button class="settings-style-btn" data-map-style="cycling" type="button"><span class="settings-style-preview settings-style-preview--cycling"></span><span class="settings-style-label">Kerékpár</span></button>
                <button class="settings-style-btn" data-map-style="topo" type="button"><span class="settings-style-preview settings-style-preview--topo"></span><span class="settings-style-label">Domborzat</span></button>
                <button class="settings-style-btn" data-map-style="satellite" type="button"><span class="settings-style-preview settings-style-preview--satellite"></span><span class="settings-style-label">Műhold</span></button>
                <button class="settings-style-btn" data-map-style="hybrid" type="button"><span class="settings-style-preview settings-style-preview--hybrid"></span><span class="settings-style-label">Hybrid</span></button>
                <button class="settings-style-btn" data-map-style="light" type="button"><span class="settings-style-preview settings-style-preview--light"></span><span class="settings-style-label">Világos</span></button>
                <button class="settings-style-btn" data-map-style="dark" type="button"><span class="settings-style-preview settings-style-preview--dark"></span><span class="settings-style-label">Sötét</span></button>
              </div>
            </div>
          </div>
          </div>
        </div>
        <div class="vw-charts" id="v-charts-wrap" hidden>
          <div id="v-charts"></div>
        </div>
      </main>
    </div>
  </div>

  <div id="v-loading" class="vw-state"><div class="v-spin"></div>Útvonal betöltése…</div>
  <div id="v-error" class="vw-state" hidden>
    <strong style="color:var(--text)">Az útvonal nem található.</strong>
    <span>Lehet, hogy törölték, vagy a megosztás ki van kapcsolva.</span>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script type="module" src="./src/view.js"></script>
</body>
</html>
