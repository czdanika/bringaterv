<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- PWA: telepíthető app (iPhone / iPad: Megosztás → Főképernyőhöz adás) -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bringaterv">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="./src/assets/icons/apple-touch-icon.png">
  <title>Bringaterv – Bejelentkezés</title>
  <link rel="stylesheet" href="./src/install.css">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="./src/impersonate.js"></script>
  <script src="./src/version.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center; gap: clamp(32px, 7vw, 110px);
      padding: 32px 24px;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #10151a;
      color: #fff;
      overflow-x: hidden;
    }

    /* ── Háttér: stilizált térkép, rajta kirajzolódó útvonal ── */
    .bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .bg .contour { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 1.2; }
    .bg .road    { fill: none; stroke: rgba(255,255,255,0.07); stroke-width: 2; stroke-linecap: round; }
    .bg .ghost   { fill: none; stroke: rgba(252,76,2,0.16); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .bg .route   { fill: none; stroke: #ff6a3d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round;
                   stroke-dasharray: 1; stroke-dashoffset: 1; filter: drop-shadow(0 0 8px rgba(252,76,2,.55)); }
    .bg-shade { position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(120% 90% at 30% 40%, rgba(16,21,26,0) 0%, rgba(16,21,26,.55) 70%, rgba(16,21,26,.9) 100%); }

    /* ── Márka (gépen bal oldalt, telefonon felül) ── */
    .brand { position: relative; z-index: 5; display: flex; flex-direction: column; align-items: flex-start; max-width: 460px;
             animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
    .brand-emblem { width: clamp(84px, 11vw, 132px); aspect-ratio: 1; border-radius: 50%; object-fit: cover;
                    box-shadow: 0 14px 40px rgba(0,0,0,.45), 0 0 0 4px rgba(255,255,255,.08);
                    animation: drop .8s cubic-bezier(.3,1.5,.5,1) .1s both; }
    .brand-name { margin-top: 22px; font-family: 'Montserrat', sans-serif; font-weight: 900; letter-spacing: -1.5px; line-height: 1;
                  font-size: clamp(40px, 5.2vw, 68px); color: #fff; text-decoration: none; }
    .brand-name .accent { color: #fc4c02; }
    .brand-slogan { margin-top: 12px; font-size: clamp(15px, 1.5vw, 19px); color: rgba(255,255,255,.72); }
    .about-link { display: inline-block; margin-top: 18px; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
                  color: #fff; text-decoration: none; background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.14);
                  transition: background .18s, transform .12s; }
    .about-link:hover { background: rgba(255,255,255,.18); }
    .about-link:active { transform: scale(.97); }

    /* ── Kártya ── */
    .card {
      position: relative; z-index: 10;
      width: 400px; max-width: 100%; flex: 0 0 auto;
      padding: 30px 32px 20px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 22px;
      color: #1a1a1a;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      animation: rise .7s cubic-bezier(.2,.8,.2,1) .12s both;
      transition: opacity .35s ease, transform .35s ease;
    }
    .card h1 { font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -.3px; margin-bottom: 18px; }
    .card.shake { animation: shake .42s cubic-bezier(.36,.07,.19,.97); }
    body.is-leaving .card  { opacity: 0; transform: translateY(-14px) scale(.98); }
    body.is-leaving .brand { opacity: 0; transition: opacity .35s ease; }

    .input-wrap { position: relative; margin-bottom: 10px; }
    .input-wrap svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: rgba(0,0,0,0.32);
                      pointer-events: none; transition: color .2s; }
    .input-wrap:focus-within svg { color: #fc4c02; }

    input[type="text"], input[type="password"], input[type="email"] {
      width: 100%; padding: 13px 16px 13px 42px;
      background: rgba(0, 0, 0, 0.045); border: 1.5px solid rgba(0, 0, 0, 0.10); border-radius: 12px;
      color: #1a1a1a; font-size: 15px; font-family: inherit; outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    input::placeholder { color: rgba(0, 0, 0, 0.34); }
    input:focus { border-color: #fc4c02; background: #fff; box-shadow: 0 0 0 4px rgba(252, 76, 2, 0.12); }

    .error-msg { font-size: 12.5px; color: #d63030; margin-bottom: 8px; min-height: 18px; text-align: left; padding-left: 2px; }

    .login-btn {
      position: relative; width: 100%; height: 46px;
      background: #fc4c02; color: #fff; font-size: 15px; font-weight: 600; font-family: inherit;
      border: none; border-radius: 12px; cursor: pointer; letter-spacing: 0.2px;
      box-shadow: 0 8px 20px rgba(252,76,2,.28);
      transition: background 0.18s, transform 0.1s, box-shadow .18s;
    }
    .login-btn:hover { background: #e04400; }
    .login-btn:active { transform: scale(0.98); }
    .login-btn:disabled { background: rgba(0, 0, 0, 0.16); cursor: not-allowed; box-shadow: none; }
    .login-btn.is-busy { color: transparent; cursor: progress; }
    .login-btn.is-busy::after { content: ""; position: absolute; inset: 0; margin: auto; width: 18px; height: 18px; border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .7s linear infinite; }
    .login-btn.is-ok { background: #16a34a; color: transparent; box-shadow: 0 8px 20px rgba(22,163,74,.3); }
    .login-btn .ok { position: absolute; inset: 0; margin: auto; width: 22px; height: 22px; opacity: 0; }
    .login-btn.is-ok .ok { opacity: 1; }
    .login-btn.is-ok .ok path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: check .3s ease-out .05s forwards; }

    .consent { display: flex; align-items: flex-start; gap: 8px; text-align: left; font-size: 12px; color: rgba(0, 0, 0, 0.58);
               margin: 6px 2px 10px; line-height: 1.45; }
    .consent input[type="checkbox"] { flex: 0 0 auto; width: 16px; height: 16px; margin-top: 1px; accent-color: #fc4c02; cursor: pointer; }
    .consent label { cursor: pointer; }
    .consent a { color: #fc4c02; font-weight: 600; text-decoration: none; }
    .consent a:hover { text-decoration: underline; }

    .forgot-link { display: block; margin-top: 14px; text-align: center; font-size: 13px; color: rgba(0,0,0,.55); text-decoration: none; }
    .forgot-link:hover { color: #fc4c02; text-decoration: underline; }
    .register-link { margin-top: 10px; text-align: center; font-size: 13px; color: rgba(0,0,0,.55); }
    .register-link a { color: #fc4c02; font-weight: 600; text-decoration: none; }
    .register-link a:hover { text-decoration: underline; }
    .card-footer { margin-top: 16px; font-size: 11px; color: rgba(0, 0, 0, 0.32); text-align: center; }

    /* a mezők egymás után jelennek meg */
    #loginForm > * { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
    #loginForm > :nth-child(1) { animation-delay: .22s; }
    #loginForm > :nth-child(2) { animation-delay: .28s; }
    #loginForm > :nth-child(3) { animation-delay: .34s; }
    #loginForm > :nth-child(n+4) { animation-delay: .40s; }

    @keyframes rise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes drop  { from { opacity: 0; transform: translateY(-26px) scale(.9); } to { opacity: 1; transform: none; } }
    @keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); }
                       30%, 50%, 70% { transform: translateX(-7px); } 40%, 60% { transform: translateX(7px); } }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes check { to { stroke-dashoffset: 0; } }

    /* Telefon / álló képernyő: a márka felül, középen, alatta a kártya */
    @media (max-width: 860px) {
      body { flex-direction: column; justify-content: flex-start; gap: 22px;
             padding: calc(5vh + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
      .brand { align-items: center; text-align: center; }
      .brand-emblem { width: 92px; }
      .brand-name { margin-top: 14px; font-size: 36px; letter-spacing: -1px; }
      .brand-slogan { margin-top: 6px; font-size: 14.5px; }
      .about-link { margin-top: 12px; padding: 6px 12px; font-size: 12.5px; }
      .card { padding: 24px 22px 16px; }
      .bg-shade { background: linear-gradient(180deg, rgba(16,21,26,.15) 0%, rgba(16,21,26,.8) 60%); }
    }
    @media (max-height: 640px) and (max-width: 860px) { .brand-emblem { width: 64px; } .about-link { display: none; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <!-- Háttér: szintvonalak + kirajzolódó útvonal (a szintvonalakat a lenti szkript rajzolja) -->
  <svg class="bg" id="bgMap" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g id="bgContours"></g>
    <path class="road" d="M-20 640 C 260 600, 420 760, 700 700 S 1180 520, 1620 600"/>
    <path class="road" d="M520 -20 C 560 200, 420 380, 520 560 S 700 860, 640 1020"/>
    <path class="road" d="M1180 -20 C 1120 180, 1260 360, 1200 560 S 1080 860, 1140 1020"/>
    <path id="bgRouteGhost" class="ghost" d="M110 800 C 260 900, 420 760, 600 840 S 900 940, 1080 840 S 1330 760, 1400 620 S 1500 420, 1420 300 S 1300 150, 1180 130"/>
    <path class="route" pathLength="1" d="M110 800 C 260 900, 420 760, 600 840 S 900 940, 1080 840 S 1330 760, 1400 620 S 1500 420, 1420 300 S 1300 150, 1180 130">
      <animate attributeName="stroke-dashoffset" dur="11s" repeatCount="indefinite" values="1;0;0;0" keyTimes="0;0.68;0.9;1" calcMode="spline" keySplines=".4 0 .2 1;0 0 1 1;0 0 1 1"/>
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.9;1"/>
    </path>
    <circle cx="110" cy="800" r="9" fill="#22c55e" stroke="#fff" stroke-width="3"/>
    <g>
      <circle r="20" fill="rgba(252,76,2,.28)"><animate attributeName="r" dur="1.6s" repeatCount="indefinite" values="12;26;12"/></circle>
      <circle r="9" fill="#ff6a3d" stroke="#fff" stroke-width="3"/>
      <animateMotion dur="11s" repeatCount="indefinite" keyPoints="0;1;1;1" keyTimes="0;0.68;0.9;1" calcMode="spline" keySplines=".4 0 .2 1;0 0 1 1;0 0 1 1">
        <mpath href="#bgRouteGhost"/>
      </animateMotion>
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.9;1"/>
    </g>
  </svg>
  <div class="bg-shade"></div>

  <div class="brand">
    <img class="brand-emblem" src="./src/assets/icons/icon-512.png" alt="">
    <a class="brand-name" href="./bemutato" title="Mi az a Bringaterv?">Bringa<span class="accent">terv</span></a>
    <p class="brand-slogan">Tervezz, tekerj, fedezd fel!</p>
    <a class="about-link" href="./bemutato">Mi ez?</a>
  </div>

  <div class="card" id="loginCard">
    <h1>Belépés</h1>

    <form id="loginForm" novalidate>
      <div class="input-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <input id="username" type="text" name="username"
          placeholder="E-mail-cím vagy felhasználónév" autofocus autocomplete="username">
      </div>

      <div class="input-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input id="password" type="password" name="password"
          placeholder="Jelszó" autocomplete="current-password">
      </div>

      <div class="consent">
        <input type="checkbox" id="privacyConsent">
        <label for="privacyConsent">Elolvastam és tudomásul vettem az
          <a href="./privacy.html" target="_blank" rel="noopener">adatkezelési tájékoztatót</a>.</label>
      </div>

      <p class="error-msg" id="errorMsg" aria-live="polite"></p>

      <button class="login-btn" type="submit" disabled><span class="lbl">Belépés</span><svg class="ok" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <a class="forgot-link" href="./reset">Elfelejtetted a jelszavad?</a>
      <p class="register-link" id="registerLink" hidden>Nincs fiókod? <a href="./register">Regisztrálj</a></p>
    </form>

    <p class="card-footer">Bringaterv &nbsp;·&nbsp; <span id="loginVersion"></span> &nbsp;·&nbsp; © Czibolya Dániel 2026</p>
  </div>

  <script>
    document.getElementById("loginVersion").textContent = window.APP_VERSION ?? "";
    // szintvonalak: néhány „domb” köré hullámos, egymásba ágyazott zárt görbék (mindig ugyanaz a rajz)
    (function () {
      let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const hills = [[330, 300, 250], [1250, 640, 300], [820, 820, 200], [1380, 140, 190], [760, 120, 170], [120, 620, 180]];
      let out = "";
      for (const [cx, cy, R] of hills) {
        const ph = [rnd() * 6.28, rnd() * 6.28, rnd() * 6.28];
        for (let r = R; r > 30; r -= 34) {
          let d = "";
          for (let k = 0; k <= 48; k++) {
            const a = (k / 48) * Math.PI * 2;
            const rr = r * (1 + 0.16 * Math.sin(2 * a + ph[0]) + 0.09 * Math.sin(3 * a + ph[1]) + 0.05 * Math.sin(5 * a + ph[2]));
            d += (k ? "L" : "M") + (cx + rr * Math.cos(a)).toFixed(1) + " " + (cy + rr * 0.8 * Math.sin(a)).toFixed(1);
          }
          out += '<path class="contour" d="' + d + 'Z"/>';
        }
      }
      document.getElementById("bgContours").innerHTML = out;
      // kevesebb mozgás kérésénél a kész útvonal áll a képen
      const svg = document.getElementById("bgMap");
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { try { svg.pauseAnimations(); svg.setCurrentTime(8.5); } catch (e) {} }
    })();
  </script>
  <script type="module">
    import { login, isAuthenticated } from "./src/auth.js";
    import { initInstallPrompt, registerServiceWorker } from "./src/ui/installPrompt.js";
    initInstallPrompt();
    registerServiceWorker();

    if (isAuthenticated()) {
      window.location.replace("./index.html");
    }

    const form    = document.getElementById("loginForm");
    const errEl   = document.getElementById("errorMsg");
    const btn     = form.querySelector(".login-btn");
    const consent = document.getElementById("privacyConsent");

    // „Nincs fiókod? Regisztrálj” – csak ha az admin bekapcsolta a nyílt regisztrációt
    fetch("/api/register/status").then((r) => r.json()).then((d) => {
      document.getElementById("registerLink").hidden = !d.open;
    }).catch(() => {});

    // Az adatkezelési tájékoztató verziója – ha változik, újra kell pipálni
    const PRIVACY_VERSION = "2026-10";
    const ACCEPT_KEY = "bringaterv.privacyAccepted";

    // Korábban elfogadta-e (azonos verziót)? Akkor előre bepipáljuk.
    try {
      if (localStorage.getItem(ACCEPT_KEY) === PRIVACY_VERSION) consent.checked = true;
    } catch {}

    function syncBtn() { btn.disabled = !consent.checked; }
    consent.addEventListener("change", () => {
      syncBtn();
      try {
        if (consent.checked) localStorage.setItem(ACCEPT_KEY, PRIVACY_VERSION);
        else localStorage.removeItem(ACCEPT_KEY);
      } catch {}
    });
    syncBtn();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!consent.checked) {
        errEl.textContent = "A belépéshez fogadd el az adatkezelési tájékoztatót.";
        return;
      }
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      errEl.textContent = "";

      const card = document.getElementById("loginCard");
      const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      btn.disabled = true;
      btn.classList.add("is-busy");
      try {
        await login(username, password);
        // siker: pipa a gombon, a kártya kiúszik, aztán az app
        btn.classList.remove("is-busy"); btn.classList.add("is-ok");
        if (!calm) {
          await new Promise((r) => setTimeout(r, 380));
          document.body.classList.add("is-leaving");
          await new Promise((r) => setTimeout(r, 300));
        }
        window.location.replace("./index.html");
        return;
      } catch (err) {
        errEl.textContent = err.message || "Hibás felhasználónév vagy jelszó.";
        document.getElementById("password").value = "";
        document.getElementById("password").focus();
        card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
      }
      btn.classList.remove("is-busy");
      btn.disabled = !consent.checked;
    });
  </script>
</body>
</html>
